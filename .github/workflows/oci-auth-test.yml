
name: OCI Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentication:
    name: Verify OCI credentials
    runs-on: ubuntu-latest

    env:
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ vars.OCI_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure OCI credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" \
            > "$HOME/.oci/devops_api_key.pem"

          chmod 600 "$HOME/.oci/devops_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/devops_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"

      - name: Install OCI CLI
        run: |
          python -m pip install --user oci-cli

      - name: Verify OCI identity
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          oci iam user get \
            --user-id "$OCI_USER_OCID" \
            --auth api_key \
            --output table

      - name: Cleanup credentials
        if: always()
        run: |
          rm -rf "$HOME/.oci"
