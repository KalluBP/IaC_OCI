
name: Terraform OCI

on:
  push:
    branches:
      - trunk
    paths:
      - "bootstrap/identity/**"
      - ".github/workflows/terraform-oci.yml"

permissions:
  contents: read

concurrency:
  group: terraform-oci-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ======================================================
  # JOB 1: STATIC VALIDATION AND SECURITY
  # No OCI credentials required
  # ======================================================

  validate:
    name: Validation and Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: bootstrap/identity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: bootstrap/identity
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          hide-progress: true

  # ======================================================
  # JOB 2: APPROVED DEV DEPLOYMENT
  # Only job with OCI credentials
  # ======================================================

  deploy-dev:
    name: Approved Deployment - DEV
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - validate

    environment:
      name: dev

    defaults:
      run:
        working-directory: bootstrap/identity

    env:
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}

    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify required credentials
        shell: bash
        run: |
          set -euo pipefail

          : "${TF_VAR_user_ocid:?Missing OCI_USER_OCID secret}"
          : "${TF_VAR_tenancy_ocid:?Missing OCI_TENANCY_OCID secret}"
          : "${TF_VAR_fingerprint:?Missing OCI_FINGERPRINT secret}"
          : "${TF_VAR_private_key:?Missing OCI_PRIVATE_KEY secret}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Terraform Initialize
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Generate deployment plan
        run: |
          terraform plan \
            -var-file=dev.tfvars \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan
